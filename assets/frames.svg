<svg xmlns="http://www.w3.org/2000/svg" width="822" height="272" viewBox="0 0 822 272"><rect x="0" y="0" width="822" height="272" fill="#F7F6F1"/><defs><style>text{font-family:ui-monospace,Menlo,Consolas,monospace}</style></defs><text x="8" y="22" font-size="13" fill="#252524" font-weight="bold">bitfold — 6-frame story (static)</text><g transform="translate(16,38) scale(0.34)"><rect x="0" y="0" width="760" height="320" fill="#F7F6F1" stroke="#DCDAD1"/><text x="380" y="120" text-anchor="middle" font-size="54" fill="#252524" font-weight="bold">bitfold</text><line x1="180" y1="150" x2="580" y2="150" stroke="#DCDAD1" stroke-width="2"/><text x="380" y="185" text-anchor="middle" font-size="17" fill="#676662">RFC 1951 DEFLATE + CRC-32 / Adler-32 — from scratch, std-only Rust</text><text x="380" y="215" text-anchor="middle" font-size="14" fill="#5B51C7">entropy folds the data down; the ledger measures how far</text><text x="380" y="290" text-anchor="middle" font-size="11" fill="#676662">bitfold 1.0.0 · 6 frames · 2 s each</text></g><g transform="translate(282,38) scale(0.34)"><rect x="0" y="0" width="760" height="320" fill="#F7F6F1" stroke="#DCDAD1"/><text x="60" y="60" font-size="24" fill="#252524" font-weight="bold">the corpus</text><line x1="60" y1="74" x2="700" y2="74" stroke="#DCDAD1"/><text x="150" y="110" font-size="16" fill="#252524">rfc1951</text><text x="560" y="110" font-size="16" fill="#252524" text-anchor="end">36944 bytes</text><text x="640" y="110" font-size="13" fill="#676662" text-anchor="end">92 syms</text><text x="150" y="144" font-size="16" fill="#252524">rfc8439</text><text x="560" y="144" font-size="16" fill="#252524" text-anchor="end">88847 bytes</text><text x="640" y="144" font-size="13" fill="#676662" text-anchor="end">97 syms</text><text x="150" y="178" font-size="16" fill="#252524">b0000796</text><text x="560" y="178" font-size="16" fill="#252524" text-anchor="end">148898 bytes</text><text x="640" y="178" font-size="13" fill="#676662" text-anchor="end">12 syms</text><text x="150" y="232" font-size="16" fill="#252524" font-weight="bold">total</text><text x="560" y="232" font-size="16" fill="#252524" text-anchor="end" font-weight="bold">274689 bytes</text><text x="640" y="232" font-size="13" fill="#676662" text-anchor="end">public-domain</text><text x="60" y="290" font-size="11" fill="#676662">RFC 1951 (the spec) · RFC 8439 (ChaCha20-Poly1305) · OEIS A000796 (prime digits)</text></g><g transform="translate(548,38) scale(0.34)"><rect x="0" y="0" width="760" height="320" fill="#F7F6F1" stroke="#DCDAD1"/><text x="60" y="60" font-size="24" fill="#252524" font-weight="bold">entropy ledger</text><line x1="60" y1="74" x2="700" y2="74" stroke="#DCDAD1"/><text x="60" y="96" font-size="12" fill="#676662">Shannon H (bits/byte), bar = H / 8 of the full byte</text><text x="150" y="118" font-size="14" fill="#252524">rfc1951</text><rect x="330" y="106" width="184.231659905603" height="14" fill="#5B51C7"/><rect x="330" y="106" width="340" height="14" fill="none" stroke="#DCDAD1"/><text x="690" y="118" font-size="13" fill="#676662" text-anchor="end">H = 4.33486 b/B</text><text x="150" y="170" font-size="14" fill="#252524">rfc8439</text><rect x="330" y="158" width="200.91284178339083" height="14" fill="#5B51C7"/><rect x="330" y="158" width="340" height="14" fill="none" stroke="#DCDAD1"/><text x="690" y="170" font-size="13" fill="#676662" text-anchor="end">H = 4.72736 b/B</text><text x="150" y="222" font-size="14" fill="#252524">b0000796</text><rect x="330" y="210" width="148.88965486849233" height="14" fill="#5B51C7"/><rect x="330" y="210" width="340" height="14" fill="none" stroke="#DCDAD1"/><text x="690" y="222" font-size="13" fill="#676662" text-anchor="end">H = 3.50329 b/B</text><text x="150" y="290" font-size="14" fill="#252524" font-weight="bold">total</text><text x="690" y="290" font-size="14" fill="#5B51C7" text-anchor="end">H = 4.53187 b/B · bound 1.7653</text></g><g transform="translate(16,155) scale(0.34)"><rect x="0" y="0" width="760" height="320" fill="#F7F6F1" stroke="#DCDAD1"/><text x="60" y="60" font-size="24" fill="#252524" font-weight="bold">the encoder</text><line x1="60" y1="74" x2="700" y2="74" stroke="#DCDAD1"/><text x="60" y="112" font-size="15" fill="#676662">LZ77: chained hash + lazy matching · window 32768 · match 3..258</text><text x="60" y="144" font-size="15" fill="#676662">Huffman: canonical codes · stored / fixed / dynamic blocks</text><text x="60" y="176" font-size="15" fill="#676662">bits: data LSB-first · codes MSB-first · extras LSB-first (zlib order)</text><text x="60" y="216" font-size="15" fill="#252524">corpus → <tspan fill="#E8833A" font-weight="bold">753194 logical bits</tspan> → ratio 0.3428</text><text x="60" y="248" font-size="15" fill="#252524">zlib container: 78 9c header + Adler-32 trailer (BE)</text><text x="60" y="290" font-size="11" fill="#676662">every byte of the round trip is verified against the input, byte for byte</text></g><g transform="translate(282,155) scale(0.34)"><rect x="0" y="0" width="760" height="320" fill="#F7F6F1" stroke="#DCDAD1"/><text x="60" y="60" font-size="24" fill="#252524" font-weight="bold">verification</text><line x1="60" y1="74" x2="700" y2="74" stroke="#DCDAD1"/><text x="150" y="104" font-size="15" fill="#252524">rfc1951</text><text x="560" y="104" font-size="15" fill="#252524" text-anchor="end">12 checks</text><text x="640" y="104" font-size="15" fill="#22AC80" text-anchor="end">12 pass</text><text x="150" y="138" font-size="15" fill="#252524">bits</text><text x="560" y="138" font-size="15" fill="#252524" text-anchor="end">4 checks</text><text x="640" y="138" font-size="15" fill="#22AC80" text-anchor="end">4 pass</text><text x="150" y="172" font-size="15" fill="#252524">blocks</text><text x="560" y="172" font-size="15" fill="#252524" text-anchor="end">5 checks</text><text x="640" y="172" font-size="15" fill="#22AC80" text-anchor="end">5 pass</text><text x="150" y="206" font-size="15" fill="#252524">hash</text><text x="560" y="206" font-size="15" fill="#252524" text-anchor="end">162 checks</text><text x="640" y="206" font-size="15" fill="#22AC80" text-anchor="end">162 pass</text><text x="150" y="240" font-size="15" fill="#252524">xval</text><text x="560" y="240" font-size="15" fill="#252524" text-anchor="end">4 checks</text><text x="640" y="240" font-size="15" fill="#22AC80" text-anchor="end">4 pass</text><text x="150" y="290" font-size="16" fill="#252524" font-weight="bold">total</text><text x="560" y="290" font-size="16" fill="#252524" text-anchor="end">188 checks</text><text x="640" y="290" font-size="16" fill="#22AC80" text-anchor="end" font-weight="bold">188 pass · ALL PASS</text></g><g transform="translate(548,155) scale(0.34)"><rect x="0" y="0" width="760" height="320" fill="#F7F6F1" stroke="#DCDAD1"/><text x="380" y="110" text-anchor="middle" font-size="30" fill="#22AC80" font-weight="bold">byte-identical</text><line x1="180" y1="135" x2="580" y2="135" stroke="#DCDAD1" stroke-width="2"/><text x="380" y="170" text-anchor="middle" font-size="15" fill="#252524">dual in-process render · SHA-256 compared · pinned project date</text><text x="380" y="196" text-anchor="middle" font-size="14" fill="#676662">cross-verified both directions against CPython zlib</text><text x="380" y="222" text-anchor="middle" font-size="14" fill="#676662">our dynamic stream decodes in zlib · zlib's streams decode here</text><text x="380" y="285" text-anchor="middle" font-size="12" fill="#676662">(c) 2026 Adithya N Raj — determinism is the brand</text></g></svg>